<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail Buku - Perpustakaan Sekolah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="wrap">
      <a class="back" href="index.html">
        <iconify-icon icon="lucide:arrow-left" width="18" height="18" aria-hidden="true"></iconify-icon>
        Kembali ke katalog
      </a>
      <div id="detail"></div>
      <section class="similar" id="similar" hidden>
        <h2>Buku lain di kategori ini</h2>
        <div class="grid" id="similarGrid"></div>
      </section>
    </div>
    <div style="height:56px"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    (function () {
      UI.mountChrome('katalog');
      var root = document.getElementById('detail');
      var id = new URLSearchParams(location.search).get('id');

      function skeleton() {
        return '<div class="detail"><div class="detail-cover"><div class="skeleton" style="aspect-ratio:3/4;border-radius:4px 12px 12px 4px"></div></div>' +
          '<div class="detail-main"><div class="skeleton" style="height:22px;width:90px"></div>' +
          '<div class="skeleton" style="height:40px;width:80%"></div><div class="skeleton" style="height:18px;width:40%"></div>' +
          '<div class="skeleton" style="height:96px"></div></div></div>';
      }

      function dots(b) {
        var total = Math.min(Number(b.stok_total) || 0, 24), on = Math.min(Number(b.stok_tersedia) || 0, total), out = '';
        for (var i = 0; i < total; i++) out += '<i class="' + (i < on ? 'on' : '') + '"></i>';
        return out;
      }

      function fact(label, value) {
        return value ? '<dt>' + label + '</dt><dd>' + UI.esc(value) + '</dd>' : '';
      }

      function render(b) {
        document.title = b.judul + ' - ' + CONFIG.LIB_NAME;
        var stok = Number(b.stok_tersedia), total = Number(b.stok_total);
        root.innerHTML =
          '<div class="detail">' +
            '<div class="detail-cover">' + UI.cover(b, 'lg') + '</div>' +
            '<div class="detail-main">' +
              '<div>' +
                (b.kategori ? '<span class="badge">' + UI.esc(b.kategori) + '</span>' : '') +
                '<h1>' + UI.esc(b.judul) + '</h1>' +
                '<p class="author">' + (b.penulis ? 'oleh ' + UI.esc(b.penulis) : 'Penulis tidak diketahui') + '</p>' +
              '</div>' +
              '<div class="panel">' +
                '<div class="avail-head">' + UI.availBadge(b) +
                  '<span>' + (total ? stok + ' dari ' + total + ' eksemplar ada di rak' : 'Belum ada eksemplar tercatat') + '</span></div>' +
                '<div class="dots" aria-hidden="true">' + dots(b) + '</div>' +
              '</div>' +
              '<dl class="facts">' +
                fact('Penerbit', b.penerbit) + fact('Tahun terbit', b.tahun) + fact('ISBN', b.isbn) + fact('Kategori', b.kategori) +
              '</dl>' +
              (b.deskripsi ? '<div><h2>Tentang buku ini</h2><p class="desc">' + UI.esc(b.deskripsi) + '</p></div>' : '') +
              '<div class="panel how">' +
                '<h2>Cara meminjam</h2>' +
                '<ul>' +
                  '<li>' + UI.icon('book-open', 20) + '<span>Cari bukunya di rak sesuai kategori, atau tanyakan ke petugas.</span></li>' +
                  '<li>' + UI.icon('id-card', 20) + '<span>Bawa ke meja petugas dan sebutkan NIS-mu.</span></li>' +
                  '<li>' + UI.icon('clock', 20) + '<span>Pantau sisa waktu pinjam di halaman Cek pinjaman.</span></li>' +
                '</ul>' +
              '</div>' +
            '</div>' +
          '</div>';
      }

      function card(b) {
        return '<a class="book" href="book.html?id=' + encodeURIComponent(b.id) + '">' + UI.cover(b) +
          '<div class="book-info"><h3 class="book-title">' + UI.esc(b.judul) + '</h3>' +
          '<p class="book-author">' + UI.esc(b.penulis || '') + '</p>' + UI.availBadge(b) + '</div></a>';
      }

      async function loadSimilar(b) {
        if (!b.kategori) return;
        try {
          var data = await API.get('listBooks', { kategori: b.kategori, pageSize: 6 }, 120);
          var items = data.items.filter(function (x) { return x.id !== b.id; }).slice(0, 5);
          if (!items.length) return;
          document.getElementById('similarGrid').innerHTML = items.map(card).join('');
          document.getElementById('similar').hidden = false;
        } catch (e) { /* bagian opsional, abaikan */ }
      }

      async function init() {
        if (!id) {
          root.innerHTML = UI.state({
            icon: 'search-x', title: 'Buku tidak dipilih', text: 'Buka buku dari halaman katalog.',
            action: '<a class="btn btn-soft" href="index.html">Ke katalog</a>'
          });
          return;
        }
        root.innerHTML = skeleton();
        try {
          var b = await API.get('getBook', { id: id });
          render(b);
          loadSimilar(b);
        } catch (e) {
          root.innerHTML = UI.state({
            icon: 'search-x', title: 'Buku tidak bisa dimuat', text: e.message,
            action: '<a class="btn btn-soft" href="index.html">Kembali ke katalog</a>'
          });
        }
      }
      init();
    })();
  </script>
</body>
</html>
